services:
  model_cache_init:
    image: alpine:3.22
    command: ["sh", "-c", "chown -R 10001:10001 /model-cache"]
    volumes:
      - paddle-model-cache:/model-cache
    restart: "no"

  api:
    user: root
    build: .
    ports:
      # PHP/host calls port 4207; Uvicorn stays on port 8000 inside Docker.
      - "4207:8000"
    env_file:
      - .env
    environment:
      AUTO_RELOAD: "${AUTO_RELOAD:-false}"
      RELOAD_DELAY_SECONDS: "${RELOAD_DELAY_SECONDS:-5}"
    depends_on:
      model_cache_init:
        condition: service_completed_successfully
    volumes:
      # Host code changes appear immediately inside the development container.
      - ./src:/app/src:ro
      - ./main.py:/app/main.py:ro
      - paddle-model-cache:/app/.model_cache/paddle
    command:
      - /bin/sh
      - -c
      - |
        if [ "$$AUTO_RELOAD" = "true" ]; then
          exec uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-delay "$$RELOAD_DELAY_SECONDS" --reload-dir /app
        fi
        exec uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1
    cpus: "${API_CPU_LIMIT:-4.0}"
    mem_limit: "${API_MEMORY_LIMIT:-12g}"
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  paddle-model-cache:
