# ──────────────────────────────────────────────────────────────────────────
# Invoice OCR API — Docker Compose
#
# Default (CPU-only, no Ollama):
#   docker compose up -d
#   docker compose logs -f invoice-ocr
#
# With the Qwen/Ollama fallback enabled:
#   docker compose --profile ollama up -d
#
# Model weights live in ./models on the host, mounted to /models in the
# container.  On the first run PaddleOCR downloads its model weights
# automatically (~200 MB).  Subsequent runs reuse the cached weights.
#
# Ollama models are cached in ./ollama-models on the host, so the
# first pull is not repeated on every restart.
# ──────────────────────────────────────────────────────────────────────────

services:
  invoice-ocr:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Ollama is reachable at the service name when both are on the
      # default network.  The Ollama profile also overrides this env var.
      OLLAMA_HOST: http://ollama:11434
    volumes:
      - ./models:/models
      - ./output:/output
    restart: unless-stopped

  # Optional Qwen sidecar.  Enabled with: docker compose --profile ollama up -d
  #
  # Runs on CPU by default so the profile works on any machine.  A GPU is a
  # large speedup for the vision tier, but is NOT required — enable it by
  # uncommenting the deploy block below *only* on a host with the NVIDIA
  # container toolkit installed.  Leaving it commented keeps the CPU-only
  # deployment in the spec working out of the box.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ./ollama-models:/root/.ollama/models
    profiles:
      - "ollama"
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  # Placeholder so `docker compose config` is valid; the Ollama model cache is
  # bound to ./ollama-models on the host (see the ollama service above).
  ollama-placeholder:
