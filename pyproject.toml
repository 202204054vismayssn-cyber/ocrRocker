[project]
name = "uae-invoice-reader"
version = "0.2.0"
description = "High-throughput asynchronous invoice extraction API using local PaddleOCR and Ollama Gemma structured JSON"
readme = "README.md"
authors = [
    { name = "vikaspande18", email = "vp2841144@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.0",
    "numpy>=1.24.0",
    "ollama>=0.4.0",
    "paddleocr>=2.9.0",
    "paddlepaddle>=3.2.0",
    "pillow>=11.0.0",
    "pydantic-settings>=2.10.0",
    "pymupdf>=1.26.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
uae-invoice-reader = "uae_invoice_reader:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
