version: '3.8'

services:
  invoice-ocr:
    image: vismayshinde/invoice-ocr:latest
    container_name: invoice-ocr
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
      - ./output:/output
    restart: unless-stopped
    environment:
      # Optional: Configure Ollama for Qwen semantic fallback
      - OLLAMA_HOST=http://host.docker.internal:11434
      - INVOICE_QWEN_MODEL=qwen2.5vl:3b
      - OLLAMA_TIMEOUT=180
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
